[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editing-caption-evaluation"
version = "0.1.0"
description = "Reproducible paired evaluation of structured image-editing captions"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.36,<2", "jsonschema>=4.25,<5", "numpy>=2.2,<3",
  "pyarrow>=20,<25", "requests>=2.31,<3", "scipy>=1.15,<2",
]

[project.optional-dependencies]
embedding = ["torch>=2.6,<3", "transformers>=4.50,<6"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
